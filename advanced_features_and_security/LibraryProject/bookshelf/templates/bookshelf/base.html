<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Library{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <h1>My Library</h1>
        <nav>
            <a href="{% url 'add_book' %}">Add Book</a> |
            <a href="{% url 'book_list' %}">View Books</a>
        </nav>
        <hr>
    </header>

    <main>
        {% block content %}
        <!-- Page-specific content will go here -->
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>&copy; 2025 My Library</p>
    </footer>
</body>
</html>
