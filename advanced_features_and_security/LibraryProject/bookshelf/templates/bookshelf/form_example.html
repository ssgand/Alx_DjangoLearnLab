{% extends "base.html" %}

{% block content %}
<h1>Add a New Book</h1>

<form method="post" action="{% url 'add_book' %}">
    {% csrf_token %}  <!-- Protects against CSRF attacks -->

    <div>
        <label for="id_title">Title:</label>
        <input type="text" name="title" id="id_title" maxlength="255" required>
    </div>

    <div>
        <label for="id_author">Author:</label>
        <input type="text" name="author" id="id_author" maxlength="255" required>
    </div>

    <div>
        <label for="id_publication_year">Publication Year:</label>
        <input type="number" name="publication_year" id="id_publication_year" min="0" required>
    </div>

    <button type="submit">Save Book</button>
</form>

{% if messages %}
    <ul>
    {% for message in messages %}
        <li>{{ message }}</li>
    {% endfor %}
    </ul>
{% endif %}

{% endblock %}
