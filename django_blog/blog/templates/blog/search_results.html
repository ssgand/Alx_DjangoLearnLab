<h2>Search results for "{{ q }}"</h2>

{% for post in results %}
    <h3>{{ post.title }}</h3>
    <p>{{ post.content|truncatewords:30 }}</p>

    <p>
        Tags:
        {% for tag in post.tags.all %}
            <a href="{% url 'posts_by_tag' tag.name %}">{{ tag.name }}</a>
        {% endfor %}
    </p>
{% empty %}
    <p>No results found.</p>
{% endfor %}
